<p>“真正的强大里没有沾沾自喜的优越感，也没有惴惴不安的得失心，只有沉静的自信，以及壮阔的谦卑。”</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/2025/11/05/%E7%94%B5%E6%8E%A7/%E5%9F%B9%E8%AE%AD/1.1%E5%86%8D%E8%B0%88%E6%8C%87%E9%92%88/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%94%B5%E6%8E%A7/">电控</a></object></span><span class="tags"><object><a href="/tags/%E5%9F%B9%E8%AE%AD/">培训</a></object></span><time datetime="2025-11-04T16:00:00.000Z">2025-11-05</time></div><h1 class="recent-title">1.1 再谈C语言指针</h1><div class="recent-excerpt"><hr><p>之前，我们在学习C语言的过程中对指针已经有过相关了解，现在让我们再聊聊指针</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/2025/11/04/%E5%B5%8C%E5%85%A5%E5%BC%8F/%E6%9E%B6%E6%9E%84/solid%E5%8E%9F%E5%88%99%E7%9A%84%E8%BD%AF%E4%BB%B6%E6%9E%B6%E6%9E%84/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E6%9E%B6%E6%9E%84/">架构</a></object></span><span class="tags"><object><a href="/tags/%E5%B5%8C%E5%85%A5%E5%BC%8F/">嵌入式</a></object></span><time datetime="2025-11-03T16:00:00.000Z">2025-11-04</time></div><h1 class="recent-title">基于solid原则的面向对象MCU平台化软件架构</h1><div class="recent-excerpt"><hr><p>传统的MCU开发常陷入“面向过程”或“硬件寄存器操作”的泥潭，导致代码高度耦合、难以复用和测试。我们的目标是构建一个：面向对象, 平台化, SOLID化的软件架构</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/2025/11/01/%E5%B5%8C%E5%85%A5%E5%BC%8F/%E6%9E%B6%E6%9E%84/%E5%B5%8C%E5%85%A5%E5%BC%8F%20C%20%E7%BC%96%E7%A8%8B%E8%AE%BE%E8%AE%A1%E6%A8%A1%E5%BC%8F/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%B5%8C%E5%85%A5%E5%BC%8F/">嵌入式</a></object></span><span class="tags"><object><a href="/tags/%E6%9E%B6%E6%9E%84/">架构</a></object></span><time datetime="2025-10-31T16:00:00.000Z">2025-11-01</time></div><h1 class="recent-title">嵌入式 C 编程设计模式</h1><div class="recent-excerpt"><hr><p>在嵌入式C语言中，设计模式能够帮助我们组织代码，在架构设计中广泛应用，可以提升我们的架构设计，使代码更简洁，易维护，以便后续拓展，同时，创建设计模式也被用来抽象对象的实例化过程，从而在创建和配置对象时提供灵活性。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/2025/10/09/%E5%AD%A6%E4%B9%A0%E7%AC%94%E8%AE%B0/%E7%96%91%E9%97%AE%E4%B9%8B%E7%BE%8E/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E9%80%9A%E8%AF%86/">通识</a></object></span><span class="tags"><object><a href="/tags/%E6%8F%90%E9%97%AE/">提问</a></object></span><time datetime="2025-10-08T16:00:00.000Z">2025-10-09</time></div><h1 class="recent-title">疑问之美：成为信息时代真正的主宰</h1><div class="recent-excerpt"><hr><p>在纳新和日常工作过程中难免会遇到各种类型的问题：有些提问表达含糊、不知所云，令回答者无从下手；有些问题过于简单，甚至让人觉得浪费时间去解答。这篇内容，希望能够帮助提问者学会如何优雅而高效地提出问题，从而提升交流效率，促进技术共享与团队协作。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/2025/09/24/%E7%94%B5%E6%8E%A7/RMEC/%E5%8A%9F%E7%8E%87%E8%A7%A3%E7%AE%97/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%94%B5%E6%8E%A7/">电控</a></object></span><span class="tags"><object><a href="/tags/RMEC/">RMEC</a></object></span><time datetime="2025-09-23T16:00:00.000Z">2025-09-24</time></div><h1 class="recent-title">功率解算</h1><div class="recent-excerpt"></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/2025/08/26/%E7%94%B5%E6%8E%A7/RMEC/%E5%BA%95%E7%9B%98%E8%A7%A3%E7%AE%97/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%94%B5%E6%8E%A7/">电控</a></object></span><span class="tags"><object><a href="/tags/RMEC/">RMEC</a></object></span><time datetime="2025-08-25T16:00:00.000Z">2025-08-26</time></div><h1 class="recent-title">底盘解算</h1><div class="recent-excerpt"><hr><p>麦轮，全向轮，舵轮，运动学解算和动力学解算尽在掌控之中!</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/2025/08/14/%E7%94%B5%E6%8E%A7/RMEC/%E4%B8%B2%E5%8F%A3%E9%80%9A%E4%BF%A1/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%94%B5%E6%8E%A7/">电控</a></object></span><span class="tags"><object><a href="/tags/RMEC/">RMEC</a></object></span><time datetime="2025-08-13T16:00:00.000Z">2025-08-14</time></div><h1 class="recent-title">组内串口通信制定</h1><div class="recent-excerpt"><hr><p>一套设计精良的串口通信协议是整个串口通信系统的灵魂。它不仅决定了通信的效率和可靠性，更直接影响到系统的维护性、扩展性和生命周期成本。在嵌入式系统中，串口通信设计的两大宗旨：稳定可靠，实时</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/2025/07/27/%E7%94%B5%E6%8E%A7/%E5%AF%BC%E8%AE%BA/%E7%94%B5%E6%8E%A7%E7%BB%84%E4%BB%A3%E7%A0%81%E8%A7%84%E8%8C%83/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%94%B5%E6%8E%A7/">电控</a></object></span><span class="tags"><object><a href="/tags/%E5%AF%BC%E8%AE%BA/">导论</a></object></span><time datetime="2025-07-26T16:00:00.000Z">2025-07-27</time></div><h1 class="recent-title">电控组代码规范</h1><div class="recent-excerpt"><hr><p>遵循良好的变量命名规则和最佳实践对于编写可读、可维护的代码至关重要。合理的变量命名不仅能帮助开发者理解代码的功能，还能在团队合作中减少沟通成本。如果不符合此规则发现，将会要求强制修改。</p></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/2025/07/23/%E5%B5%8C%E5%85%A5%E5%BC%8F/STM32/CubeMX%E9%85%8D%E7%BD%AE%E8%AF%A6%E8%A7%A3/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E5%B5%8C%E5%85%A5%E5%BC%8F/">嵌入式</a></object></span><span class="tags"><object><a href="/tags/STM32/">STM32</a></object></span><time datetime="2025-07-22T16:00:00.000Z">2025-07-23</time></div><h1 class="recent-title">CubeMX配置详解</h1><div class="recent-excerpt"></div><span class="read-more">阅读文章 +</span></object></a><a class="recent-post" href="/2025/06/26/%E7%94%B5%E6%8E%A7/%E5%AF%BC%E8%AE%BA/100ask/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%94%B5%E6%8E%A7/">电控</a></object></span><span class="tags"><object><a href="/tags/%E5%AF%BC%E8%AE%BA/">导论</a></object></span><time datetime="2025-06-25T16:00:00.000Z">2025-06-26</time></div><h1 class="recent-title">1000ask</h1><div class="recent-excerpt"><hr><p>此模块为嵌入式相关小问题的合集，在此每日发布一个嵌入式相关的小问题，并附上
