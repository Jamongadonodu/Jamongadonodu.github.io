    <script data-pjax-tool>
        // 可重入的初始化函数：首载与 PJAX 跳转后都会执行
        window.canmaskInit = (function () {
            const startInput = document.getElementById('startId');
            const endInput = document.getElementById('endId');
            const calcBtn = document.getElementById('calcBtn');
            const resultArea = document.getElementById('resultArea');
            // PJAX 重执行脚本时元素可能尚未就绪，缺任一元素则跳过本次初始化
            if (!startInput || !endInput || !calcBtn || !resultArea) return;

            // 获取当前帧类型
            function getBitLength() {
                const radio = document.querySelector('input[name="bitMode"]:checked');
                return radio ? parseInt(radio.value, 10) : 11;
            }

            // 十六进制解析，支持 0x 前缀
            function parseHexInput(value) {
                if (typeof value !== 'string') return NaN;
                let cleaned = value.trim();
                if (cleaned.startsWith('0x') || cleaned.startsWith('0X')) {
                    cleaned = cleaned.substring(2);
                }
                return parseInt(cleaned, 16);
            }

            // 格式化十六进制，带 0x
            function toHex(num, bitLength) {
                const hexStr = num.toString(16).toUpperCase();
                if (bitLength === 11) {
                    return '0x' + hexStr.padStart(3, '0');
                } else {
                    return '0x' + hexStr.padStart(8, '0');
                }
            }

            // 生成二进制字符串，按位分组 (11-bit 或 29-bit)
            function toBinary(num, bitLength) {
                let bin = num.toString(2).padStart(bitLength, '0');
                if (bitLength === 11) {
                    // 分组: 4-4-3
                    return bin.slice(0, 4) + ' ' + bin.slice(4, 8) + ' ' + bin.slice(8, 11);
                } else { // 29-bit
                    // 分组: 4-4-4-4-4-4-4-1 (7组4位 + 1位)
                    let parts = [];
                    for (let i = 0; i < 7; i++) {
                        parts.push(bin.slice(i * 4, i * 4 + 4));
                    }
                    parts.push(bin.slice(28, 29));
                    return parts.join(' ');
                }
            }

            // 核心：计算最小掩码集合
            // 采用"对齐块拆分"算法：每个 Filter 覆盖一个 2^k 对齐的连续区间，
            // 保证精确覆盖（不多收、不漏收），且 Filter 数量最少。
            // 例：0x201~0x208 → {0x201,m0} {0x202,m1} {0x204,m3} {0x208,m0} 共 4 个
            function computeFilters(startId, endId, bitLength) {
                if (isNaN(startId) || isNaN(endId) || startId < 0 || endId < 0 || startId > endId) {
                    return [];
                }
                const maxId = (1 << bitLength) - 1;
                if (startId > maxId || endId > maxId) {
                    return [];
                }

                const result = [];
                let current = startId;

                while (current <= endId) {
                    // 找从 current 起、2^(k+1) 对齐且不越界的最大块（size = 2^k）
                    let k = 0;
                    while (k < bitLength &&
                        (current & ((1 << (k + 1)) - 1)) === 0 &&      // current 是 2^(k+1) 的倍数
                        (current + (1 << (k + 1)) - 1) <= endId) {     // 块不越过 endId
                        k++;
                    }

                    const size = 1 << k;
                    const mask = size - 1;                 // 忽略低 k 位（STM32 掩码位=1 表示忽略）
                    const filter = current & ~mask;        // 高 (bitLength-k) 位作为匹配值

                    result.push({
                        filter: filter,
                        mask: mask,
                        start: current,
                        end: current + size - 1
                    });
                    current += size;

                    if (result.length > 100) break;
                }

                return result;
            }

            function renderResult() {
                const rawStart = startInput.value;
                const rawEnd = endInput.value;
                const bitLength = getBitLength();
                const startId = parseHexInput(rawStart);
                const endId = parseHexInput(rawEnd);

                // 验证
                if (isNaN(startId) || isNaN(endId)) {
                    resultArea.innerHTML = `<div class="empty-message">⚠️ 请输入有效的十六进制 ID (如 200, 0x7FF)</div>`;
                    return;
                }
                const maxId = (1 << bitLength) - 1;
                if (startId < 0 || endId < 0 || startId > maxId || endId > maxId) {
                    resultArea.innerHTML = `<div class="empty-message">⚠️ ID 超出 ${bitLength}-bit 范围 (0 ~ ${toHex(maxId, bitLength)})</div>`;
                    return;
                }
                if (startId > endId) {
                    resultArea.innerHTML = `<div class="empty-message">⚠️ 起始 ID 不能大于结束 ID</div>`;
                    return;
                }

                const filters = computeFilters(startId, endId, bitLength);
                if (!filters || filters.length === 0) {
                    resultArea.innerHTML = `<div class="empty-message">⚠️ 无法计算，请检查输入范围</div>`;
                    return;
                }

                // 统计信息
                const totalIds = endId - startId + 1;
                const coveredIds = filters.reduce((sum, f) => sum + (f.end - f.start + 1), 0);
                const singleMaskOk = filters.length === 1 && coveredIds === totalIds;

                let html = `<div class="summary">
                <div class="stat">
                    <span><strong>📌 范围</strong> ${toHex(startId, bitLength)} ~ ${toHex(endId, bitLength)}</span>
                    <span><strong>🧩 ID 数量</strong> ${totalIds}</span>
                    <span><strong>📦 Filter 数</strong> ${filters.length}</span>
                    <span><strong>✅ 覆盖</strong> ${coveredIds === totalIds ? '完整 ✓' : '不完整 ⚠️'}</span>
                    <span><strong>🔗 单个 Mask 覆盖</strong> ${singleMaskOk ? '可以 ✓' : `需拆分 ${filters.length} 个`}</span>
                </div>
                <span class="badge">${bitLength}-bit</span>
            </div>`;

                html += `<div class="filter-grid">`;
                filters.forEach((f, idx) => {
                    const filterHex = toHex(f.filter, bitLength);
                    const maskHex = toHex(f.mask, bitLength);                  // 忽略掩码（1=忽略，STM32 语义）
                    const fixedMaskHex = toHex((~f.mask) & maxId, bitLength);  // 固定掩码（1=必须匹配）
                    const rangeStartHex = toHex(f.start, bitLength);
                    const rangeEndHex = toHex(f.end, bitLength);

                    // 二进制显示
                    const filterBin = toBinary(f.filter, bitLength);
                    const maskBin = toBinary(f.mask, bitLength);               // 忽略掩码二进制
                    const fixedMaskBin = toBinary((~f.mask) & maxId, bitLength); // 固定掩码二进制

                    // 固定掩码二进制：1(必须匹配) 高亮，0(任意) 淡化
                    const fixedMaskBinHtml = fixedMaskBin.split(' ').map(g =>
                        g.replace(/1/g, '<span class="bit1">1</span>')
                            .replace(/0/g, '<span class="bit0">0</span>')
                    ).join(' ');

                    // 判断是否精确覆盖目标范围
                    const isCovered = (f.start >= startId && f.end <= endId);

                    // STM32 32-bit 滤波寄存器高 16 位值（CAN_FILTERSCALE_32BIT + 标准帧布局：STID 位于 bit[31:21]）
                    const fr1 = (f.filter & 0x7FF) << 5;
                    const fr2 = (f.mask & 0x7FF) << 5;
                    const stmHint = bitLength === 11
                        ? `FilterIdHigh / FilterMaskIdHigh = 0x${fr1.toString(16).toUpperCase().padStart(4, '0')} / 0x${fr2.toString(16).toUpperCase().padStart(4, '0')} (FilterIdLow/MaskLow = 0)`
                        : '29-bit 请按扩展帧布局配置 FilterId(EXID) 与掩码';

                    html += `<div class="filter-item">
                    <div class="filter-header">
                        <span class="filter-label">Filter #${idx + 1}</span>
                        <span class="filter-mask">Filter = ${filterHex}</span>
                        <span class="filter-range">📎 ${rangeStartHex} ~ ${rangeEndHex}</span>
                        ${isCovered ? '✅' : '⚠️ 越界'}
                    </div>
                    <div class="filter-binary">
                        <span><span class="binary-highlight">Filter</span> ${filterBin} = ${filterHex}</span>
                        <span><span class="binary-highlight">忽略Mask(STM32)</span> ${maskBin} = ${maskHex}</span>
                    </div>
                    <div style="margin-top:10px; background:rgba(0,200,83,.12); border:1px solid rgba(0,200,83,.35); border-radius:14px; padding:10px 18px;">
                        <div style="font-weight:700; color:#00c853; font-size:18px;">🎯 固定 Mask（1=必须匹配） = ${fixedMaskHex}</div>
                        <div style="font-family:'JetBrains Mono',monospace; font-size:20px; letter-spacing:3px; margin-top:4px; color:#00c853;">${fixedMaskBinHtml}</div>
                    </div>
                    <div style="margin-top:6px; font-size:12px; color:var(--theme-text); background:rgba(34,187,255,.05); padding:4px 14px; border-radius:40px; border:1px solid var(--theme-border-soft);">
                        🧮 STM32 32-bit: ${stmHint}
                    </div>
                </div>`;
                });
                html += `</div>`;

                if (coveredIds !== totalIds) {
                    html += `<div style="margin-top: 16px; background: rgba(230,126,34,.12); padding: 12px 20px; border-radius: 40px; border-left: 6px solid #e67e22; color: #e67e22;">
                    ⚠️ 当前 Filter 集合未能完全覆盖目标范围 (覆盖 ${coveredIds}/${totalIds})，可能因为范围不连续或超出边界。
                </div>`;
                } else {
                    html += `<div style="margin-top: 16px; background: rgba(0,200,83,.12); padding: 8px 20px; border-radius: 40px; border-left: 6px solid #00c853; color: #00c853;">
                    ✅ 所有 Filter 精确覆盖目标范围，无多余 ID。
                </div>`;
                }

                resultArea.innerHTML = html;
            }

            // 事件绑定
            calcBtn.addEventListener('click', renderResult);
            startInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') renderResult(); });
            endInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') renderResult(); });
            document.querySelectorAll('input[name="bitMode"]').forEach(radio => {
                radio.addEventListener('change', renderResult);
            });

            // 初始计算
            renderResult();
        });

        // 完整加载时注册一次全局监听（防止 PJAX 重复进入时累积监听）
        if (!window.__canmaskBound) {
            window.__canmaskBound = true;
            document.addEventListener('pjax:complete', window.canmaskInit);
        }
        // 首次加载或 PJAX 进入本页时初始化（主题执行器会在 pjax:complete 后重新执行本脚本）
        window.canmaskInit();
    </script>
